# Without this, netlify dev misdetects the project as TanStack Start (via
# @tanstack/react-router) and waits on port 3000 instead of Vite's 5173.
[dev]
framework = "vite"

# API routes. These must come before the SPA catch-all — Netlify applies the
# first matching redirect rule.
[[redirects]]
from = "/api/montage/share"
to = "/.netlify/functions/share-montage"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
